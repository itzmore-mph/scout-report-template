scouting:
  summary:
    - 20-year-old left-footed attacking full-back (LB), 181 cm. 1,631 minutes in Polish 1 Liga 2025/26, role score +0.80, rank 2 of 64.
    - In 1 Liga a high-volume creator from the left, 96th pct for touches in the box and 92nd for shot assists, with four assists.
    - Academy product, promoted with Wisła. Now a regular in Ekstraklasa at 20, where his defending held and his attacking output fell.

  # Open after video: what he can become, by when, and what has to happen for it.
  projection:

  strengths:
    - Defensive duels won, 99th then 94th pct
    - Chance creation from the left in 1 Liga
    - Interceptions up to 82nd pct after promotion
    - Ekstraklasa regular at 20

  development:
    - Beating a man, dribble success 6th pct
    - Offensive duels won, 1st pct in Ekstraklasa
    - Final-third volume since promotion

  risks:
    - Role score fell from +0.80 (2/64) to +0.01 (19/41) after the move to Poland Ekstraklasa
    - Attacking output not yet shown at top level
    - Small Ekstraklasa sample, 955 minutes
    - Market value missing in Wyscout, check Transfermarkt

